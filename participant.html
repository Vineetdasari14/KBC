<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBC Participant</title><link rel="stylesheet" href="styles.css"><script src="js/config.js"></script><script src="js/common.js"></script></head>
<body><main class="app shell">
<div class="topbar"><div class="brand-inline"><div class="mini-logo">K</div><div><h1>Champion Seat</h1><div class="sub">Participant console</div></div></div><a class="btn btn-ghost" href="index.html">Home</a></div>
<section id="join" class="panel login"><div class="center"><h2>Join the Game</h2><p class="muted">Enter the name shown on the live audience screen.</p></div><div class="field"><label>Participant Name</label><input id="pname" maxlength="80" placeholder="Your name"></div><button id="joinBtn" class="btn btn-gold" style="width:100%">Enter Game</button><div id="joinError" class="error"></div></section>
<section id="game" style="display:none"><div class="grid-2"><div class="panel"><div id="qbox" class="question-box"><div class="muted">Waiting for the host...</div></div></div><div class="panel center"><div id="timer" class="timer">--</div><p id="stateText" class="muted">Waiting</p><button id="submitBtn" class="btn btn-gold" disabled>Submit Answer</button><div id="answerMsg" class="success"></div></div></div></section>
</main>
<script>
let SB, state=null, participantId=localStorage.getItem("kbc_participant_id")||makeId(), participantName="", selected=null, submittedFor=null, timerHandle=null;
localStorage.setItem("kbc_participant_id",participantId);
function qMarkup(g){if(!g||!g.question_text)return `<div class="muted">Waiting for the host to start the next question.</div>`;return `<div class="question-meta"><span>Question ${g.question_number}</span><span>${fmtMoney(g.prize)}</span></div><h2 class="question-text">${esc(g.question_text)}</h2><div class="options">${["A","B","C","D"].map(x=>`<button class="option ${selected===x?"selected":""}" data-opt="${x}" ${state?.status!=="live"||submittedFor===g.question_id?"disabled":""}><span class="letter">${x}</span><span>${esc(g["option_"+x.toLowerCase()])}</span></button>`).join("")}</div>`}
function render(){qs("#qbox").innerHTML=qMarkup(state);qsa(".option[data-opt]").forEach(b=>b.onclick=()=>{selected=b.dataset.opt;render();qs("#submitBtn").disabled=!selected||submittedFor===state?.question_id});qs("#stateText").textContent=state?.status==="live"?"Choose one answer":"Waiting for host";startTimer()}
function startTimer(){clearInterval(timerHandle);if(!state?.ends_at||state.status!=="live"){qs("#timer").textContent="--";return}const tick=()=>{const left=Math.max(0,Math.ceil((new Date(state.ends_at)-Date.now())/1000));qs("#timer").textContent=left;if(left<=0){clearInterval(timerHandle);qs("#stateText").textContent="Time is up";qsa(".option").forEach(b=>b.disabled=true);qs("#submitBtn").disabled=true}};tick();timerHandle=setInterval(tick,250)}
async function submit(){if(!selected||!state?.question_id||submittedFor===state.question_id)return;const {error}=await SB.from("participant_answers").insert({participant_id:participantId,participant_name:participantName,question_id:state.question_id,selected_option:selected});if(error){qs("#answerMsg").textContent=error.message;qs("#answerMsg").className="error"}else{submittedFor=state.question_id;qs("#answerMsg").textContent="Answer submitted.";render()}}
async function init(){SB=await getSB();qs("#joinBtn").onclick=async()=>{participantName=qs("#pname").value.trim();if(!participantName){qs("#joinError").textContent="Enter your name.";return}await SB.from("viewers").insert({viewer_name:participantName});qs("#join").style.display="none";qs("#game").style.display="block";qs("#submitBtn").onclick=submit};
const {data:g,error}=await SB.from("game_state").select("*").eq("id",true).single();if(!error){state=g;render()}
SB.channel("participant-game").on("postgres_changes",{event:"UPDATE",schema:"public",table:"game_state"},p=>{state=p.new;selected=null;submittedFor=null;qs("#answerMsg").textContent="";render()}).subscribe()}
init();
</script></body></html>
