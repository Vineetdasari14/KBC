<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBC Live</title>
<link rel="stylesheet" href="styles.css">
<script src="js/config.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<main class="app shell">
<div class="topbar"><div class="brand-inline"><div class="mini-logo">K</div><div><h1>Live Audience</h1><div class="sub">Public viewing screen</div></div></div><a class="btn btn-ghost" href="index.html">Home</a></div>
<section id="join" class="panel login"><div class="center"><h2>Enter the Audience</h2><p class="muted">Your name is used only to identify you on this device.</p></div><div class="field"><label for="vname">Your Name</label><input id="vname" maxlength="80" placeholder="Audience member"></div><button id="joinBtn" class="btn btn-gold" style="width:100%">Continue</button><div id="joinError" class="error"></div></section>
<section id="live" style="display:none"><div class="live-layout"><div class="panel"><div id="qbox" class="question-box"><div class="muted">Waiting for the host...</div></div></div><div class="panel"><div class="section-title"><h2>Live Selections</h2><span id="count" class="status-pill pill-idle">0</span></div><div id="selections" class="selection-list"></div><div id="reveal" style="display:none" class="reveal"></div></div></div></section>
</main>
<script>
let SB=null,state=null,liveChannel=null,viewerRegistered=localStorage.getItem("kbc_viewer_registered")==="1";
function renderQ(){
  const hasQuestion=!!state&&!!state.question_text;
  if(!hasQuestion){qs("#qbox").innerHTML=`<div class="muted">The host has not started a question.</div>`;qs("#reveal").style.display="none";return}
  const revealed=state.reveal_answer===true;
  const correctOption=revealed?(state.selected_option||null):null;
  qs("#qbox").innerHTML=`<div class="question-meta"><span>Question ${state.question_number}</span><span>${fmtMoney(state.prize)}</span></div><h2 class="question-text">${esc(state.question_text)}</h2><div class="options">${["A","B","C","D"].map(x=>`<div class="option ${revealed&&x===correctOption?"answer-correct":""}"><span class="letter">${x}</span><span>${esc(state["option_"+x.toLowerCase()])}</span></div>`).join("")}</div>${revealed?`<div class="reveal">The host has revealed the answer.</div>`:""}`;
  if(revealed){qs("#reveal").style.display="block";qs("#reveal").textContent="Answer revealed by the host."}else qs("#reveal").style.display="none";
}
function clearSelections(){qs("#selections").innerHTML="";qs("#count").textContent="0"}
function appendSelection(x){
  const row=document.createElement("div");
  row.className="selection";
  row.dataset.participant=x.participant_id;
  row.innerHTML=`<span class="who">${esc(x.participant_name)}</span><span class="pick">${esc(x.selected_option)}</span>`;
  const existing=qs(`#selections [data-participant="${CSS.escape(x.participant_id)}"]`);
  if(existing) existing.replaceWith(row); else qs("#selections").appendChild(row);
  qs("#count").textContent=qsa("#selections .selection").length;
}
async function loadSelections(){
  if(!state?.question_id){clearSelections();return}
  const {data,error}=await SB.from("live_selections").select("participant_id,participant_name,selected_option,selected_at").eq("question_id",state.question_id).order("selected_at",{ascending:false});
  if(error){qs("#selections").innerHTML=`<div class="error">${esc(error.message)}</div>`;qs("#count").textContent="0";return}
  clearSelections();
  (data||[]).forEach(appendSelection);
}
async function registerViewer(){
  if(viewerRegistered)return true;
  const n=qs("#vname").value.trim();
  if(n.length<2){qs("#joinError").textContent="Enter at least 2 characters.";return false}
  const {error}=await SB.from("viewers").insert({viewer_name:n});
  if(error){qs("#joinError").textContent=error.message;return false}
  localStorage.setItem("kbc_viewer_registered","1");
  viewerRegistered=true;
  return true;
}
async function init(){
  SB=await getSB();
  qs("#joinBtn").onclick=async()=>{if(!(await registerViewer()))return;qs("#join").style.display="none";qs("#live").style.display="block";renderQ();await loadSelections()};
  const {data:g,error}=await SB.from("game_state").select("*").eq("id",true).single();
  if(!error)state=g;
  renderQ();
  liveChannel=SB.channel("public-live")
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"game_state"},async p=>{state=p.new;renderQ();await loadSelections()})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"live_selections"},p=>{if(state?.question_id===p.new.question_id)appendSelection(p.new)})
    .subscribe();
}
window.addEventListener("beforeunload",()=>{if(liveChannel)SB?.removeChannel(liveChannel)});
init();
</script>
</body>
</html>
