<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBC Live</title><link rel="stylesheet" href="styles.css"><script src="js/config.js"></script><script src="js/common.js"></script></head>
<body><main class="app shell">
<div class="topbar"><div class="brand-inline"><div class="mini-logo">K</div><div><h1>Live Audience</h1><div class="sub">Public viewing screen</div></div></div><a class="btn btn-ghost" href="index.html">Home</a></div>
<section id="join" class="panel login"><div class="center"><h2>Enter the Audience</h2><p class="muted">Your name is used only to identify you on this device.</p></div><div class="field"><label>Your Name</label><input id="vname" maxlength="80" placeholder="Audience member"></div><button id="joinBtn" class="btn btn-gold" style="width:100%">Continue</button></section>
<section id="live" style="display:none"><div class="live-layout"><div class="panel"><div id="qbox" class="question-box"><div class="muted">Waiting for the host...</div></div></div><div class="panel"><div class="section-title"><h2>Live Selections</h2><span id="count" class="status-pill pill-idle">0</span></div><div id="selections" class="selection-list"></div><div id="reveal" style="display:none" class="reveal"></div></div></div></section>
</main>
<script>
let SB,state=null;
function renderQ(){qs("#qbox").innerHTML=!state||!state.question_text?`<div class="muted">The host has not started a question.</div>`:`<div class="question-meta"><span>Question ${state.question_number}</span><span>${fmtMoney(state.prize)}</span></div><h2 class="question-text">${esc(state.question_text)}</h2><div class="options">${["A","B","C","D"].map(x=>`<div class="option"><span class="letter">${x}</span><span>${esc(state["option_"+x.toLowerCase()])}</span></div>`).join("")}</div>${state.reveal_answer?`<div class="reveal">The host has revealed the answer.</div>`:""}`;if(state?.reveal_answer){qs("#reveal").style.display="block";qs("#reveal").textContent="Answer revealed by the host."}else qs("#reveal").style.display="none"}
async function loadSelections(){if(!state?.question_id){qs("#selections").innerHTML="";qs("#count").textContent="0";return}const {data,error}=await SB.from("live_selections").select("participant_id,participant_name,selected_option,selected_at").eq("question_id",state.question_id).order("selected_at",{ascending:false});if(error)return;qs("#count").textContent=(data||[]).length;qs("#selections").innerHTML=(data||[]).map(x=>`<div class="selection"><span class="who">${esc(x.participant_name)}</span><span class="pick">${x.selected_option}</span></div>`).join("")||`<div class="muted">No answers yet.</div>`}
async function init(){SB=await getSB();qs("#joinBtn").onclick=async()=>{const n=qs("#vname").value.trim();if(!n)return;await SB.from("viewers").insert({viewer_name:n});qs("#join").style.display="none";qs("#live").style.display="block";renderQ();await loadSelections()};
const {data:g}=await SB.from("game_state").select("*").eq("id",true).single();state=g;renderQ();
SB.channel("public-live").on("postgres_changes",{event:"UPDATE",schema:"public",table:"game_state"},async p=>{state=p.new;renderQ();await loadSelections()}).on("postgres_changes",{event:"INSERT",schema:"public",table:"live_selections"},async()=>loadSelections()).subscribe()}
init();
</script></body></html>
